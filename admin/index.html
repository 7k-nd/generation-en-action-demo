<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Administration</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75,400..800;0,100,400..800&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body" data-admin="login">
  <main class="admin-login-page">
    <div class="wrap">
      <a class="brand" href="../index.html">
        <span class="brand-stamp">G·A</span>
        <span class="brand-text">
          <strong>Génération en Action</strong>
          <small>Administration</small>
        </span>
      </a>
      <form class="form admin-login-form" id="login-form">
        <span class="eyebrow">Espace interne</span>
        <h1>Espace équipe.</h1>
        <p class="muted">Articles, messages du formulaire contact. Réservé à l'équipe de l'ASBL.</p>
        <div class="form-error" id="login-error" hidden>Mot de passe incorrect.</div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-block" type="submit">Entrer</button>
        <p class="form-note">Démo : le mot de passe est dans <code>js/admin-config.js</code> (voir aussi <a href="README.md">admin/README.md</a>). Ce n'est pas une sécurité de production.</p>
      </form>
    </div>
  </main>
  <div id="admin-footer"></div>
  <script src="../js/admin-config.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
