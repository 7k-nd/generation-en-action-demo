<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie — Génération en Action</title>
  <meta name="description" content="Moments forts de Génération en Action à Bruxelles : rêves, sport, street art, rencontres intergénérationnelles.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75,400..800;0,100,400..800&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="galerie">
  <a class="skip" href="#contenu">Aller au contenu</a>
  <div id="site-header"></div>

  <header class="page-hero">
    <img class="hero-bg" src="https://images.unsplash.com/photo-1469571486292-0ba58a3f068b?auto=format&fit=crop&w=2000&q=80" alt="Cercle de personnes qui se tiennent la main">
    <div class="wrap">
      <span class="eyebrow" style="color:#c4a35a">Instants</span>
      <h1>On se souvient.</h1>
      <p>Rêves, matchs, murs peints, rencontres. Pour les photos de terrain, suivez aussi Instagram.</p>
    </div>
  </header>

  <main id="contenu">
    <section class="section">
      <div class="wrap">
        <div class="gallery" style="grid-template-rows: 260px 260px 260px;">
          <figure>
            <img src="https://images.unsplash.com/photo-1609220136736-443140cffec6?auto=format&fit=crop&w=1400&q=80" alt="Grand-parent et enfant">
            <figcaption>Lien — Bruxelles</figcaption>
          </figure>
          <figure>
            <img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?auto=format&fit=crop&w=900&q=80" alt="Enfant qui dessine">
            <figcaption>J'ai un rêve · HUDERF</figcaption>
          </figure>
          <figure>
            <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=900&q=80" alt="Football">
            <figcaption>Kings League</figcaption>
          </figure>
          <figure>
            <img src="https://images.unsplash.com/photo-1499781350541-7783f6c6a0c8?auto=format&fit=crop&w=900&q=80" alt="Street art">
            <figcaption>Les liens du temps</figcaption>
          </figure>
          <figure>
            <img src="https://images.unsplash.com/photo-1581579438747-104c53d7fbc4?auto=format&fit=crop&w=900&q=80" alt="Mains d'une personne âgée">
            <figcaption>J'ai un rêve senior</figcaption>
          </figure>
          <figure>
            <img src="https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=900&q=80" alt="Cuisine">
            <figcaption>Atelier cuisine</figcaption>
          </figure>
          <figure>
            <img src="https://images.unsplash.com/photo-1541849546-216549ae216d?auto=format&fit=crop&w=900&q=80" alt="Bruxelles">
            <figcaption>Koekelberg &amp; alentours</figcaption>
          </figure>
        </div>
        <div class="center mt">
          <a class="btn" href="https://www.instagram.com/team.generation_action" target="_blank" rel="noopener">Voir @team.generation_action</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/site.js"></script>
</body>
</html>
